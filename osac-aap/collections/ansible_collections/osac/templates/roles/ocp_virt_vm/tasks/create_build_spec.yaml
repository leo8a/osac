---
# Build root disk volume definition (dataVolume)
- name: Build root disk volume (dataVolume)
  ansible.builtin.set_fact:
    root_disk_volume:
      - name: root-disk
        dataVolume:
          name: "{{ compute_instance_name }}-root-disk"

- name: Build template spec base (Linux)
  ansible.builtin.set_fact:
    vm_template_spec:
      domain:
        cpu:
          sockets: "{{ vm_cpu_sockets }}"
          cores: 1
          threads: 1
        memory:
          guest: "{{ vm_memory }}"
        resources:
          requests:
            memory: "{{ vm_memory }}"
        devices:
          disks:
            - name: root-disk
              disk:
                bus: virtio
          interfaces:
            - name: default
              binding:
                name: l2bridge
          # USB tablet provides absolute cursor positioning for VNC
          inputs:
            - name: tablet
              type: tablet
              bus: usb
        features:
          smm:
            enabled: true
          acpi: {}
          apic: {}
          hyperv:
            relaxed: {}
            vapic: {}
            spinlocks:
              spinlocks: 8191
      networks:
        - name: default
          pod: {}
      volumes: "{{ root_disk_volume }}"
  when: guest_os_family != 'windows'

- name: Build template spec base (Windows)
  ansible.builtin.set_fact:
    vm_template_spec:
      domain:
        cpu:
          sockets: "{{ vm_cpu_sockets }}"
          cores: 1
          threads: 1
        memory:
          guest: "{{ vm_memory }}"
        resources:
          requests:
            memory: "{{ vm_memory }}"
        firmware:
          bootloader:
            efi:
              secureBoot: true
        clock:
          utc: {}
          timer:
            hpet:
              present: false
            pit:
              tickPolicy: delay
            rtc:
              tickPolicy: catchup
            hyperv: {}
        devices:
          disks:
            - name: root-disk
              disk:
                bus: virtio
          interfaces:
            - name: default
              binding:
                name: l2bridge
          # USB tablet provides absolute cursor positioning for VNC
          inputs:
            - name: tablet
              type: tablet
              bus: usb
          tpm: {}
          rng: {}
        features:
          smm:
            enabled: true
          acpi: {}
          apic: {}
          hyperv:
            relaxed: {}
            vapic: {}
            spinlocks:
              spinlocks: 8192
      networks:
        - name: default
          pod: {}
      volumes: "{{ root_disk_volume }}"
  when: guest_os_family == 'windows'

- name: Add GPU passthrough devices to template spec
  ansible.builtin.set_fact:
    vm_template_spec: "{{ vm_template_spec | combine(gpu_patch, recursive=True, list_merge='append') }}"
  vars:
    gpu_patch:
      domain:
        devices:
          hostDevices:
            - name: "gpu-{{ item }}"
              deviceName: "{{ compute_instance.spec.gpu.resourceName }}"
  loop: "{{ range(compute_instance.spec.gpu.count | int) | list }}"
  when: compute_instance.spec.gpu is defined

# GPUs (e.g. AMD Instinct MI325X) expose very large PCI BARs that can only be
# mapped with UEFI (OVMF) + above-4G decoding. Under the Linux default SeaBIOS
# the guest hangs early at boot with a blank console. Windows already boots UEFI
# in its base spec (secureBoot: true) above, so scope this to Linux to avoid
# downgrading Windows Secure Boot. secureBoot: false matches the KubeVirt-native
# reference GPU VM and avoids requiring guest Secure Boot support.
- name: Boot Linux GPU VMs with UEFI (large GPU PCI BARs need OVMF + above-4G decoding)
  ansible.builtin.set_fact:
    vm_template_spec: "{{ vm_template_spec | combine(efi_patch, recursive=True) }}"
  vars:
    efi_patch:
      domain:
        firmware:
          bootloader:
            efi:
              secureBoot: false
  when:
    - compute_instance.spec.gpu is defined
    - guest_os_family != 'windows'
