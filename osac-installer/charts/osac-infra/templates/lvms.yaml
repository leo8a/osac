{{- if .Values.lvms.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: osac-infra-lvms-config
  labels:
    {{- include "osac-infra.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  config.yaml: |
    apiVersion: lvm.topolvm.io/v1alpha1
    kind: LVMCluster
    metadata:
      name: lvms-cluster
      namespace: openshift-storage
    spec:
      storage:
        deviceClasses:
          - name: vg1
            default: true
            {{- if .Values.lvms.deviceSelector }}
            deviceSelector:
              {{- with .Values.lvms.deviceSelector.paths }}
              paths:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with .Values.lvms.deviceSelector.optionalPaths }}
              optionalPaths:
                {{- toYaml . | nindent 16 }}
              {{- end }}
            {{- end }}
            thinPoolConfig:
              name: thin-pool-1
              sizePercent: 90
              overprovisionRatio: 10
{{- end }}
